<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winter Challenge Results · Let's Golf</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/icone-winter-challenge.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/tv2.css?v=11">
</head>
<body>
  <script>
    /* Diagnostic pour les lecteurs anciens (écrit sans syntaxe récente) : tv.html?debug=1 */
    (function () {
      if (location.search.indexOf("debug") < 0) return;
      var box = document.createElement("pre"); box.id = "tv-debug";
      box.appendChild(document.createTextNode(navigator.userAgent + "\n" + window.innerWidth + "x" + window.innerHeight));
      document.documentElement.appendChild(box);
      window.onerror = function (msg, src, line) { box.appendChild(document.createTextNode("\nERREUR : " + msg + " (" + String(src).split("/").pop() + ":" + line + ")")); };
    })();
  </script>
  <div class="fond" aria-hidden="true"><i></i><i></i></div>

  <header class="haut">
    <img class="lg" src="assets/logo-letsgolf.svg" width="246" height="44" alt="Let's Golf">
    <span id="tv-points" class="points"></span>
    <span class="droite"><span class="credit">Résultats : Simulator Golf Tour</span><span id="tv-demo" class="demo" hidden>Données de démonstration</span><img class="wc" src="assets/logo-winter-challenge.svg" width="420" height="130" alt="Winter Challenge"></span>
  </header>

  <aside id="tv-panneau" class="panneau" aria-label="En bref"></aside>

  <main class="carte">
    <div class="titre">
      <div class="titre-g fondu"><div id="tv-sur" class="sur"></div><h1 id="tv-title">Classement</h1></div>
      <div class="titre-d">
        <span class="legende fondu" id="tv-legende"><i class="c"></i>Compte au classement<span class="lr"><i class="r"></i>À remplacer</span></span>
        <span id="tv-page" class="fondu"></span>
      </div>
    </div>
    <div id="tv-area" class="zone fondu"></div>
    <div class="vol" aria-hidden="true">
      <svg class="vol-sol" viewBox="0 0 1000 60" preserveAspectRatio="none"><path d="M0 52H1000" /></svg>
      <div id="tv-trace" class="vol-trace"><svg viewBox="0 0 1000 60" preserveAspectRatio="none"><path d="M12 52Q494 -44 976 52" /></svg></div>
      <div id="tv-balle" class="vol-x"><i></i></div>
      <span class="vol-tee"></span><span class="vol-trou"><b></b></span>
    </div>
  </main>

  <script src="assets/tv2.js?v=11"></script>
</body>
</html>
