<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winter Challenge Results (réduit) · Let's Golf</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/icone-winter-challenge.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/tv.css?v=12">
  <link rel="stylesheet" href="assets/tv-reduit.css?v=12">
</head>
<body class="reduit">
  <script>
    /* Diagnostic pour les lecteurs anciens (écrit sans syntaxe récente) : tvreduit.html?debug=1 */
    (function () {
      if (location.search.indexOf("debug") < 0) return;
      var box = document.createElement("pre"); box.id = "tv-debug";
      box.appendChild(document.createTextNode(navigator.userAgent + "\n" + window.innerWidth + "x" + window.innerHeight));
      document.documentElement.appendChild(box);
      window.onerror = function (msg, src, line) { box.appendChild(document.createTextNode("\nERREUR : " + msg + " (" + String(src).split("/").pop() + ":" + line + ")")); };
    })();
  </script>
  <header class="tv-top">
    <img src="assets/logo-letsgolf.svg" width="246" height="44" alt="Let's Golf">
    <span class="tv-right"><span id="tv-demo" class="tv-demo" hidden>Données de démonstration</span><img class="tv-wc" src="assets/logo-winter-challenge.svg" width="420" height="130" alt="Winter Challenge"></span>
  </header>

  <section id="tv-stats" class="tv-stats" aria-label="En bref"></section>

  <section class="tv-card" aria-live="off">
    <div class="tv-title">
      <h1 id="tv-title" class="fadeable">Classement</h1>
      <div class="meta">
        <span class="tv-legend"><i class="c"></i>Résultat compté <span class="lr"><i class="r"></i>Premier remplacé</span></span>
        <span id="tv-page" class="fadeable"></span>
      </div>
    </div>
    <div id="tv-area" class="tv-area fadeable"></div>
    <div class="tv-progress"><i id="tv-bar"></i></div>
  </section>

  <script src="assets/tv.js?v=12"></script>
</body>
</html>
